<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Roots in the Machine</title>
  <desc id="desc">A human silhouette tends a luminous tree whose roots connect human ideas to an AI network.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10152b"/>
      <stop offset=".52" stop-color="#17213c"/>
      <stop offset="1" stop-color="#071b21"/>
    </linearGradient>
    <linearGradient id="trunk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6b73c"/>
      <stop offset=".52" stop-color="#70e1b2"/>
      <stop offset="1" stop-color="#67b7ff"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#70e1b2" stop-opacity=".32"/>
      <stop offset="1" stop-color="#70e1b2" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#8bb8c9" stroke-opacity=".07"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" rx="36" fill="url(#background)"/>
  <rect width="1600" height="900" rx="36" fill="url(#grid)"/>
  <circle cx="1030" cy="380" r="420" fill="url(#glow)"/>

  <g fill="none" stroke="url(#trunk)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M960 598C955 520 982 456 1004 394C1021 345 1028 292 1024 220" stroke-width="30"/>
    <path d="M1002 402C937 363 902 320 868 266" stroke-width="17"/>
    <path d="M1016 343C1080 312 1129 273 1168 218" stroke-width="15"/>
    <path d="M1007 456C1084 438 1151 405 1211 352" stroke-width="13"/>
    <path d="M970 498C908 474 852 435 810 386" stroke-width="12"/>
    <path d="M958 593C872 626 797 665 733 724" stroke-width="18"/>
    <path d="M960 594C900 669 861 726 849 793" stroke-width="14"/>
    <path d="M968 598C1014 672 1042 733 1048 798" stroke-width="17"/>
    <path d="M969 594C1062 622 1143 666 1211 729" stroke-width="19"/>
    <path d="M965 596C1115 596 1245 616 1354 664" stroke-width="10"/>
  </g>

  <g fill="#70e1b2" filter="url(#soft-glow)">
    <circle cx="1024" cy="220" r="17"/>
    <circle cx="868" cy="266" r="14"/>
    <circle cx="1168" cy="218" r="14"/>
    <circle cx="1211" cy="352" r="13"/>
    <circle cx="810" cy="386" r="12"/>
  </g>

  <g fill="#67b7ff" filter="url(#soft-glow)">
    <circle cx="733" cy="724" r="12"/>
    <circle cx="849" cy="793" r="12"/>
    <circle cx="1048" cy="798" r="12"/>
    <circle cx="1211" cy="729" r="12"/>
    <circle cx="1354" cy="664" r="12"/>
  </g>

  <g stroke="#9fcfe2" stroke-opacity=".38" stroke-width="2">
    <path d="M733 724L849 793L1048 798L1211 729L1354 664"/>
    <path d="M810 386L868 266L1024 220L1168 218L1211 352"/>
    <path d="M868 266L1007 456L1211 352"/>
  </g>

  <g transform="translate(260 265)">
    <circle cx="150" cy="90" r="62" fill="#f2c7a5"/>
    <path d="M95 82C102 15 207 5 220 88C199 66 174 53 143 52C126 70 112 79 95 82Z" fill="#182039"/>
    <path d="M80 282C82 183 106 139 150 139C195 139 220 184 224 282Z" fill="#27496d"/>
    <path d="M210 191C286 201 349 244 391 301" fill="none" stroke="#f2c7a5" stroke-width="24" stroke-linecap="round"/>
    <circle cx="397" cy="307" r="18" fill="#f2c7a5"/>
    <path d="M107 281L78 470M196 281L230 470" fill="none" stroke="#182039" stroke-width="34" stroke-linecap="round"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="92" y="112" fill="#f4f7ff" font-size="62" font-weight="700">ROOTS IN THE MACHINE</text>
    <text x="96" y="160" fill="#9fcfe2" font-size="24" letter-spacing="4">HUMANS ARE STILL DRIVING</text>
  </g>
</svg>
