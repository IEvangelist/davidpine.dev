<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1280"
  height="720"
  viewBox="0 0 1280 720"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">Open Graph SEO: Aspire.dev's 4x Traffic Story</title>
  <desc id="desc">
    A public-receipt trail connects site-wide metadata engineering with a later
    observation of roughly four times total traffic. A badge emphasizes correlation, not
    causation.
  </desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f" />
      <stop offset="0.55" stop-color="#0c1830" />
      <stop offset="1" stop-color="#102d34" />
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed" />
      <stop offset="0.52" stop-color="#22d3ee" />
      <stop offset="1" stop-color="#34d399" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path
        d="M 48 0 L 0 0 0 48"
        fill="none"
        stroke="#94a3b8"
        stroke-opacity="0.07"
        stroke-width="1"
      />
    </pattern>
  </defs>
  <rect width="1280" height="720" rx="28" fill="url(#bg)" />
  <rect width="1280" height="720" rx="28" fill="url(#grid)" />
  <circle cx="1090" cy="100" r="230" fill="#22d3ee" opacity="0.06" />
  <circle cx="1110" cy="690" r="290" fill="#34d399" opacity="0.05" />

  <g transform="translate(78 72)">
    <rect
      width="188"
      height="38"
      rx="19"
      fill="#172554"
      stroke="#60a5fa"
      stroke-opacity="0.5"
    />
    <circle cx="23" cy="19" r="6" fill="#60a5fa" />
    <text
      x="40"
      y="25"
      fill="#bfdbfe"
      font-family="Inter, Segoe UI, sans-serif"
      font-size="16"
      font-weight="700"
      letter-spacing="1.8"
    >
      CASE STUDY
    </text>
  </g>

  <text
    x="78"
    y="184"
    fill="#f8fafc"
    font-family="Inter, Segoe UI, sans-serif"
    font-size="63"
    font-weight="800"
