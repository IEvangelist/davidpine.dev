  <g transform="translate(78 650)">
    <text
      fill="#94a3b8"
      font-family="ui-monospace, SFMono-Regular, Consolas, monospace"
      font-size="17"
    >
      ISSUES
    </text>
    <circle cx="92" cy="-6" r="4" fill="#475569" />
    <text
      x="112"
      fill="#94a3b8"
      font-family="ui-monospace, SFMono-Regular, Consolas, monospace"
      font-size="17"
    >
      PULL REQUESTS
    </text>
    <circle cx="280" cy="-6" r="4" fill="#475569" />
    <text
      x="300"
      fill="#94a3b8"
      font-family="ui-monospace, SFMono-Regular, Consolas, monospace"
      font-size="17"
    >
      TESTS
    </text>
    <circle cx="370" cy="-6" r="4" fill="#475569" />
    <text
      x="390"
      fill="#94a3b8"
      font-family="ui-monospace, SFMono-Regular, Consolas, monospace"
      font-size="17"
