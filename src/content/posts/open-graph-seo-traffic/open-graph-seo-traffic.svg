    Open Graph SEO
  </text>
  <text
    x="78"
    y="244"
    fill="#cbd5e1"
    font-family="Inter, Segoe UI, sans-serif"
    font-size="32"
    font-weight="600"
  >
    Aspire.dev's public engineering trail
  </text>

  <g transform="translate(78 318)">
    <path
      d="M 24 160 C 170 160, 152 126, 290 126 S 422 92, 554 92 S 690 30, 790 30"
      fill="none"
      stroke="#334155"
      stroke-width="18"
      stroke-linecap="round"
    />
    <path
      d="M 24 160 C 170 160, 152 126, 290 126 S 422 92, 554 92 S 690 30, 790 30"
      fill="none"
      stroke="url(#signal)"
      stroke-width="7"
      stroke-linecap="round"
      filter="url(#glow)"
    />
    <g fill="#0f172a" stroke-width="5">
      <circle cx="24" cy="160" r="15" stroke="#8b5cf6" />
      <circle cx="290" cy="126" r="15" stroke="#38bdf8" />
      <circle cx="554" cy="92" r="15" stroke="#22d3ee" />
      <circle cx="790" cy="30" r="15" stroke="#34d399" />
    </g>
    <g
      fill="#cbd5e1"
      font-family="Inter, Segoe UI, sans-serif"
      font-size="16"
      font-weight="700"
    >
      <text x="0" y="206">GENERIC CARD</text>
      <text x="238" y="172">SITE-WIDE METADATA</text>
      <text x="500" y="138">REGRESSION GUARDS</text>
    </g>
  </g>

  <g transform="translate(894 274)">
    <rect
      width="306"
      height="286"
      rx="28"
      fill="#0b1220"
      stroke="#34d399"
      stroke-opacity="0.55"
      stroke-width="2"
    />
    <text
      x="153"
