    <text
      x="153"
      y="176"
      text-anchor="middle"
      fill="#94a3b8"
      font-family="Inter, Segoe UI, sans-serif"
      font-size="17"
    >
      observed later in 1DS /
    </text>
    <text
      x="153"
      y="200"
      text-anchor="middle"
      fill="#94a3b8"
      font-family="Inter, Segoe UI, sans-serif"
      font-size="17"
    >
      Azure Monitor telemetry
    </text>
    <rect
      x="42"
      y="224"
      width="222"
      height="36"
      rx="18"
      fill="#3f1d2e"
      stroke="#fb7185"
      stroke-opacity="0.55"
    />
    <text
      x="153"
      y="248"
      text-anchor="middle"
      fill="#fecdd3"
      font-family="Inter, Segoe UI, sans-serif"
      font-size="15"
      font-weight="800"
      letter-spacing="0.5"
